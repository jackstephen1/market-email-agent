name: Daily Market Email

on:
  schedule:
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  send-market-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market email agent
        env:
          NEWS_API_KEY:        ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:       ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:     ${{ secrets.RECIPIENT_EMAIL }}
          ALPHA_VANTAGE_KEY:   ${{ secrets.ALPHA_VANTAGE_KEY }}
          FMP_API_KEY:         ${{ secrets.FMP_API_KEY }}
        run: python market_email.py

      - name: Save portfolio state
        run: |
          git config user.name "Market Agent Bot"
          git config user.email "bot@marketagent.com"
          git add portfolio.json || true
          git diff --staged --quiet || git commit -m "Update portfolio $(date +'%Y-%m-%d')"
          git push || true
